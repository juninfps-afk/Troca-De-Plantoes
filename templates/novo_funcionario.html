{% extends 'base.html' %}

{% block content %}
    <section class="form-box">
        <h1>Novo funcionário</h1>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" required maxlength="100">
            <label for="login">Usuário</label>
            <input id="login" name="login" required minlength="3" maxlength="50">
            <label for="senha">Senha inicial (15 a 128 caracteres)</label>
            <input id="senha" name="senha" type="password" required minlength="15" maxlength="128" autocomplete="new-password">
            <label for="confirmacao">Confirme a senha</label>
            <input id="confirmacao" name="confirmacao" type="password" required minlength="15" maxlength="128" autocomplete="new-password">
            <button class="botao" type="submit">Cadastrar</button>
        </form>
    </section>
{% endblock %}
