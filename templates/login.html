{% extends 'base.html' %}

{% block title %}Entrar · Troca de Plantões{% endblock %}

{% block content %}
    <section class="form-box">
        <p class="tag">ACESSO À EQUIPE</p>
        <h1>Entrar</h1>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="login">Usuário</label>
            <input id="login" name="login" autocomplete="username" required maxlength="50">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required maxlength="128">
            <button class="botao" type="submit">Entrar</button>
        </form>
        <p class="muted">Funcionário sem conta? Solicite o cadastro ao supervisor.</p>
    </section>
{% endblock %}
